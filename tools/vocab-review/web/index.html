<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>单词复习</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>

<div class="phone">
  <!-- localStorage 存不进(隐私模式)时的提醒横幅 -->
  <div class="warn" id="warn" hidden>⚠ 进度不会保存——浏览器隐私模式?</div>

  <div class="top">
    <h1>📚 单词复习</h1>
    <button class="gear" id="gear" aria-label="设置">⚙</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="stTotal">–</b><span>总词池</span></div>
    <div class="stat"><b id="stDue">–</b><span>待复习</span></div>
    <div class="stat"><b id="stToday">–</b><span>今日队列</span></div>
    <div class="stat"><b id="stGrad">–</b><span>已毕业</span></div>
  </div>

  <div class="progress">
    <span id="progText">今日 0/0</span>
    <div class="bar"><i id="barFill"></i></div>
    <span id="progPct">0%</span>
  </div>

  <!-- 卡片:正面先自测,翻面看释义 -->
  <div class="flash" id="flash">
    <div id="faceFront">
      <div class="src" id="src">生词候选 · 来自词池</div>
      <div class="word" id="word">…</div>
      <div class="phon" id="phon"></div>
      <button class="speak" id="speak">🔊 发音</button>
      <button class="reveal" id="reveal">显示释义 ⌨ 空格</button>
    </div>
    <div id="faceBack" hidden>
      <div class="back-word"><span id="wordBack"></span><button class="speak inline" id="speakBack" aria-label="发音">🔊</button></div>
      <div class="phon meta" id="phonBack"></div>
      <div class="def" id="def"></div>
      <div id="exs"></div>
    </div>
  </div>

  <!-- 判定:翻面后才出现(visibility 占位防跳动) -->
  <div class="judge" id="judge">
    <button class="btn no" id="btnNo">😒 不认识<small>隔 10 张重现 · 明日再见</small></button>
    <button class="btn yes" id="btnYes">😃 认识<small>间隔 1→3→7 天递增</small></button>
  </div>
  <div class="hint" id="hint" hidden>连认 4 次或间隔 ≥21 天 → 🎓 毕业,永久移出队列</div>

  <!-- 完成 / 出错 两个整卡画面 -->
  <div class="screen" id="done" hidden>
    <div class="big">🎉</div>
    <h2>今日队列完成</h2>
    <p class="muted" id="doneCount">复习 0 · 新词 0</p>
    <button class="reveal" id="refresh">再看看统计</button>
  </div>
  <div class="screen" id="error" hidden>
    <div class="big">📡</div>
    <h2>词库加载失败</h2>
    <p class="muted">检查网络或确认已上传 vocab.json</p>
    <button class="reveal" id="retry">重试</button>
  </div>
</div>

<!-- ⚙ 设置抽屉 -->
<aside class="panel" id="panel" aria-label="设置">
  <div class="panel-head">
    <b>⚙ 设置</b>
    <button class="close" id="panelClose" aria-label="关闭">✕</button>
  </div>
  <label class="field">每日新词上限
    <input type="number" id="dailyLimit" min="1" step="1" value="20">
  </label>
  <p class="note">改动在重新打开页面后生效</p>
  <button class="reveal" id="exportBtn">导出进度</button>
  <label class="file-btn">导入进度
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </label>
</aside>

<div class="toast" id="toast" role="status"></div>

</body>
</html>
